# =============================================================================
# DETECTIONS & TUNING PLAYBOOK BLUEPRINT - PROJECT GHOST-HUNTER
# Kumpulan Aturan Deklaratif Kustom untuk Dokumentasi Proyek Capstone
# Target Lingkungan: Agent 003 (Windows Host) & Zeek Network Subsystem
# =============================================================================

- rule:
    id: 100001
    title: "Deteksi Awal - Monitoring Sysmon Activity"
    description: "Aturan induk (Parent Rule) untuk menyaring aktivitas telemetri Sysmon berbasis Event ID terkait dari rule bawaan 61603 atau 92032."
    log_source: "Sysmon (Microsoft-Windows-Sysmon/Operational)"
    logic_condition: data.win.system.eventID TERMASUK JALUR (61603, 92032)
    mitre_mapping:
      tactic: "None (Parent Filter Rule)"
      technique_id: "None"

- rule:
    id: 100002
    title: "Deteksi Persistence - Scheduled Task Utility Executed (schtasks.exe)"
    description: "Mendeteksi eksekusi utilitas schtasks.exe berdasarkan kecocokan nama file asli (Original File Name) untuk mengantisipasi teknik pengamanan akses (Persistence) atau pencarian informasi."
    log_source: "Sysmon (Microsoft-Windows-Sysmon/Operational - Event ID 1)"
    logic_condition: >
      MEMICU RULE 100001 DAN 
      data.win.eventdata.originalFileName TEPAT (Regex Pasif: ^schtasks\.exe$)
    mitre_mapping:
      tactic: "Discovery / Persistence"
      technique_id: "T1087, T1053.005"

- rule:
    id: 100003
    title: "Deteksi Persistence - Scheduled Task Utility Executed (Command Line)"
    description: "Mendeteksi eksekusi utilitas schtasks melalui pemantauan argumen baris perintah (CLI) yang mengandung kata kunci 'schtasks'."
    log_source: "Sysmon (Microsoft-Windows-Sysmon/Operational - Event ID 1)"
    logic_condition: >
      MEMICU RULE 100001 DAN 
      data.win.eventdata.commandLine MENGANDUNG (Regex Pasif: schtasks)
    mitre_mapping:
      tactic: "Discovery / Persistence"
      technique_id: "T1087, T1053.005"

- rule:
    id: 100004
    title: "Deteksi Discovery - Potential BloodHound/SharpHound Enumeration Detected via Script Path"
    description: "Mendeteksi indikasi enumerasi Active Directory oleh tools SharpHound melalui deteksi nama file skrip SharpHound.ps1 pada jalur eksekusi skrip PowerShell."
    log_source: "Windows PowerShell Event Logs (Event ID 4104 / Script Block Logging)"
    logic_condition: >
      data.win.system.eventID TERMASUK JALUR (91809, 91837) DAN 
      data.win.eventdata.path MENGANDUNG (Regex Pasif: SharpHound\.ps1)
    mitre_mapping:
      tactic: "Execution / Discovery"
      technique_id: "T1059.001, T1087.002"

- rule:
    id: 100005
    title: "Deteksi Discovery - Potential BloodHound/SharpHound Execution Detected via ScriptBlock Text"
    description: "Mendeteksi eksekusi fungsi internal SharpHound di dalam isi konten skrip (ScriptBlock Text) untuk mengantisipasi bypass penamaan file skrip (Masquerading)."
    log_source: "Windows PowerShell Event Logs (Event ID 4104 / Script Block Logging)"
    logic_condition: >
      MEMICU RULE 100004 DAN 
      data.win.eventdata.scriptBlockText MENGANDUNG (Regex Pasif: SharpHound|InvokeSharpHound)
    mitre_mapping:
      tactic: "Execution / Defense Evasion / Discovery"
      technique_id: "T1059.001, T1027, T1087.002"

# Rule tambahan untuk deteksi anomali DNS Tunneling menggunakan sensor jaringan Zeek
- rule: 
    id: 100006
    title: "Deteksi Command and Control - DNS Tunneling Anomaly (Zeek)"
    description: "Mendeteksi saluran C2 terselubung dan komunikasi interaktif via manipulasi protokol DNS Layer 7 menggunakan sensor jaringan Zeek."
    log_source: "Zeek Network Sensor (DNS Log Subsystem - zeek-alerts-4.x-*)"
    logic_condition: >
      fields.log_source == 'zeek' DAN id.resp_p == 53 DAN (
        query.keyword MENGANDUNG '*.tunnel.capstone8.com*' ATAU 
        response_body_len > 1000 ATAU 
        (resp_mime_types.keyword == 'text/plain' DAN (message MENGANDUNG 'cmd.exe' ATAU message MENGANDUNG 'whoami' ATAU message MENGANDUNG 'ipconfig'))
      )
    mitre_mapping:
      tactic: "Command and Control"
      technique_id: "T1071.004"
