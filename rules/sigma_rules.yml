# =============================================================================
# DETECTIONS & TUNING PLAYBOOK BLUEPRINT - PROJECT GHOST-HUNTER
# Kumpulan Aturan Deklaratif Kustom untuk Dokumentasi Proyek Capstone
# Target Lingkungan: Agent 003 (Windows Host) & Zeek Network Subsystem
# =============================================================================

- rule:
    id: 100060
    title: "Deteksi Awal - Filter Aktivitas Proses Agent 003"
    description: "Aturan induk (Parent Rule) untuk menyaring telemetri pembuatan proses baru (Sysmon Event ID 1) khusus pada lingkup Agent 003."
    log_source: "Sysmon (Microsoft-Windows-Sysmon/Operational - Event ID 1)"
    logic_condition: >
      agent.id == '003' DAN data.win.system.eventID == '1'
    mitre_mapping:
      tactic: "None (Parent Filter Rule)"
      technique_id: "None"

- rule:
    id: 100061
    title: "Deteksi Persistence - Eksekusi Scheduled Tasks via Biner Asli"
    description: "Mendeteksi otomatis upaya pengamanan akses (Persistence) menggunakan utilitas schtasks.exe berdasarkan kecocokan biner Original File Name pada Agent 003."
    log_source: "Sysmon (Microsoft-Windows-Sysmon/Operational - Event ID 1)"
    logic_condition: >
      agent.id == '003' DAN data.win.system.eventID == '1' DAN 
      data.win.eventdata.originalFileName == 'schtasks.exe'
    mitre_mapping:
      tactic: "Persistence"
      technique_id: "T1053.005"

- rule:
    id: 100062
    title: "Deteksi Persistence - Perintah CLI Mengandung Kata Kunci schtasks"
    description: "Mengantisipasi teknik penyamaran biner (Masquerading) dengan mendeteksi argumen perintah CLI yang mengandung teks 'schtasks' pada Agent 003."
    log_source: "Sysmon (Microsoft-Windows-Sysmon/Operational - Event ID 1)"
    logic_condition: >
      agent.id == '003' DAN data.win.system.eventID == '1' DAN 
      data.win.eventdata.commandLine MENGANDUNG 'schtasks'
    mitre_mapping:
      tactic: "Persistence"
      technique_id: "T1053.005"

- rule:
    id: 100063
    title: "Deteksi Execution - PowerShell Obfuscated EncodedCommand"
    description: "Mendeteksi eksekusi skrip PowerShell yang disamarkan menggunakan argumen EncodedCommand pada Agent 003 untuk menyembunyikan payload berbahaya."
    log_source: "Sysmon (Microsoft-Windows-Sysmon/Operational - Event ID 1)"
    logic_condition: >
      agent.id == '003' DAN data.win.system.eventID == '1' DAN 
      data.win.eventdata.image MENGANDUNG 'powershell.exe' DAN 
      data.win.eventdata.commandLine MENGANDUNG 'EncodedCommand'
    mitre_mapping:
      tactic: "Execution"
      technique_id: "T1059.001"

- rule:
    id: 100064
    title: "Deteksi Command and Control - DNS Tunneling Anomaly (Zeek)"
    description: "Mendeteksi saluran C2 terselubung dan komunikasi interaktif via manipulasi protokol DNS Layer 7 menggunakan sensor jaringan Zeek."
    log_source: "Zeek Network Sensor (DNS Log Subsystem - zeek-alerts-4.x-*)"
    logic_condition: >
      fields.log_source == 'zeek' DAN id.resp_p == 53 DAN (
        query.keyword MENGANDUNG '*.tunnel.capstone8.com*' ATAU 
        query.keyword MENGANDUNG '*.*.*.*.tunnel.capstone8.com*' ATAU 
        response_body_len > 1000 ATAU 
        (resp_mime_types.keyword == 'text/plain' DAN (message MENGANDUNG 'cmd.exe' ATAU message MENGANDUNG 'whoami' ATAU message MENGANDUNG 'ipconfig'))
      )
    mitre_mapping:
      tactic: "Command and Control"
      technique_id: "T1071.004"

- rule:
    id: 100070
    title: "Tuning False Positive - Mengabaikan PowerShell Policy Test Files"
    description: "Aturan pengecualian (Whitelist) untuk membuang log pembuatan file temporer __PSScriptPolicyTest yang dihasilkan otomatis oleh internal Windows Windows agar tidak membanjiri dasbor (Noise Reduction)."
    log_source: "Sysmon (Microsoft-Windows-Sysmon/Operational - Event ID 11 / File Create)"
    logic_condition: >
      data.win.system.rule.id == '92213' DAN 
      data.win.eventdata.targetFilename MENGANDUNG '__PSScriptPolicyTest'
    mitre_mapping:
      tactic: "None (Tuning/Whitelist Rule)"
      technique_id: "None"